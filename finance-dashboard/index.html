<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人财务流动仪表盘</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{--bg:#08111f;--panel:#101a2d;--text:#edf4ff;--muted:#8ea1c2;--border:#23324d;--green:#47d39e;--red:#ff7784;--blue:#69a5ff;--gold:#f5c968}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0d1930,#08111f 340px);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1480px;margin:auto;padding:26px}h1{font-size:28px;margin:0 0 5px}.lead,.muted{color:var(--muted)}.lead{font-size:13px;margin-bottom:18px}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.summary,.panel,.kpi,.insight>div{background:rgba(16,26,45,.95);border:1px solid var(--border);border-radius:16px}
.summary{padding:20px;background:linear-gradient(135deg,#142441,#0f1b31)}.big{font-size:38px;font-weight:750;margin:8px 0}.summaryline{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;font-size:13px}.summaryline b{font-size:17px;display:block;margin-top:4px}
.insight{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.insight>div,.kpi{padding:14px}.insight label,.kpi label{display:block;color:var(--muted);font-size:12px}.insight b{display:block;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px}.kpi strong{display:block;font-size:20px;margin:7px 0 3px}
.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;margin-top:16px}.grid3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px;margin-top:16px}.panel{padding:14px;min-width:0}.pt{font-size:14px;font-weight:650;margin:2px 0 8px}.chart{height:360px}.chart.sm{height:310px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 8px}select,input{background:#0a1425;color:#eef4ff;border:1px solid var(--border);border-radius:10px;padding:9px 11px}
.month-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}.mk{background:#0c1526;border:1px solid var(--border);border-radius:12px;padding:11px}.mk span{color:var(--muted);font-size:12px}.mk b{display:block;margin-top:4px;font-size:17px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tab{border:1px solid var(--border);background:#0b1526;color:#9fb0cc;border-radius:999px;padding:8px 12px;cursor:pointer}.tab.active{background:#213b68;color:#fff;border-color:#4f78b7}
.table-wrap{max-height:620px;overflow:auto;border:1px solid var(--border);border-radius:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 11px;border-bottom:1px solid #1d2a43;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#121d32;z-index:2}td.desc{white-space:normal;min-width:300px;color:#c3cee2}.pos{color:var(--green);font-weight:650}.neg{color:var(--red);font-weight:650}.inv{color:var(--gold);font-weight:650}.badge{background:#1b2943;color:#c8d5eb;border-radius:999px;padding:3px 8px;font-size:11px}.foot{margin-top:18px;color:var(--muted);font-size:11px;line-height:1.6}
@media(max-width:1080px){.hero,.grid2,.grid3{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.month-kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){main{padding:14px}.kpis{grid-template-columns:repeat(2,1fr)}.month-kpis{grid-template-columns:1fr}.big{font-size:31px}.chart{height:320px}}
</style></head><body><main>
<h1>个人财务流动仪表盘</h1><div class="lead">年度总体 → 月度趋势 → 资金结构 → 点击月份下钻到逐笔流水</div>
<section class="hero"><div class="summary"><h2>全年净财务结余</h2><div class="big" id="surplus"></div><div class="muted">收入减去退款抵扣后的真实消费支出；黄金配置单独列示。</div><div class="summaryline"><div>真实收入<b id="income"></b></div><div>真实净支出<b id="expense"></b></div><div>黄金配置<b id="gold"></b></div><div>储蓄率<b id="rate"></b></div></div></div><div class="insight"><div><label>收入最高月</label><b id="bestIncome"></b></div><div><label>支出最高月</label><b id="highSpend"></b></div><div><label>单月最高结余</label><b id="bestSurplus"></b></div><div><label>单月最低结余</label><b id="worstSurplus"></b></div></div></section>
<section class="kpis"><div class="kpi"><label>工资收入</label><strong id="salary"></strong><small class="muted">核心收入</small></div><div class="kpi"><label>投资收益</label><strong id="ii"></strong><small class="muted">流水可识别</small></div><div class="kpi"><label>月均工资</label><strong id="avgSalary"></strong></div><div class="kpi"><label>月均净支出</label><strong id="avgSpend"></strong></div><div class="kpi"><label>最大单笔支出</label><strong id="largest"></strong><small class="muted" id="largestNote"></small></div><div class="kpi"><label>全年退款/冲正</label><strong id="refunds"></strong></div></section>
<section class="grid2"><div class="panel"><div class="pt">月度现金流趋势</div><div id="cash" class="chart"></div></div><div class="panel"><div class="pt">年度支出结构</div><div id="donut" class="chart"></div></div></section>
<section class="grid3"><div class="panel"><div class="pt">月度消费类别堆叠</div><div id="stack" class="chart sm"></div></div><div class="panel"><div class="pt">储蓄率 × 黄金配置</div><div id="saving" class="chart sm"></div></div><div class="panel"><div class="pt">年度资金去向</div><div id="sankey" class="chart sm"></div></div></section>
<div class="toolbar"><label>月份 <select id="monthSel"></select></label><label>流水搜索 <input id="q" placeholder="商户 / 摘要 / 类别"></label></div>
<section class="panel"><div class="pt" id="monthTitle"></div><div class="month-kpis"><div class="mk"><span>收入</span><b id="mi"></b></div><div class="mk"><span>净支出</span><b id="me"></b></div><div class="mk"><span>消费后结余</span><b id="ms"></b></div><div class="mk"><span>黄金投资</span><b id="mg"></b></div><div class="mk"><span>朝朝宝净流入</span><b id="mc"></b></div></div><div class="grid2"><div><div class="pt">当月每日收支</div><div id="daily" class="chart sm"></div></div><div><div class="pt">当月支出结构</div><div id="mdonut" class="chart sm"></div></div></div>
<div class="tabs"><button class="tab active" data-f="支出">支出</button><button class="tab" data-f="收入">收入</button><button class="tab" data-f="退款">退款/冲正</button><button class="tab" data-f="投资">投资</button><button class="tab" data-f="内部调拨">内部调拨</button><button class="tab" data-f="全部">全部</button></div>
<div class="table-wrap"><table><thead><tr><th>日期</th><th>类型</th><th>类别</th><th>对手/商户</th><th>金额</th><th>摘要</th></tr></thead><tbody id="body"></tbody></table></div></section><div class="foot">不展示银行卡号、开户行或验证码。朝朝宝视为内部调拨；黄金购买视为投资；退款/冲正抵扣支出。分类基于交易摘要规则。2025-08 与 2026-08 非完整自然月。</div>
<script>
const money=v=>"¥"+Number(v||0).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});const base={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{color:"#dfe8fb"},margin:{l:50,r:20,t:16,b:48},xaxis:{gridcolor:"#23324d"},yaxis:{gridcolor:"#23324d"}};const cfg={responsive:true,displaylogo:false};const C={income:"#47d39e",expense:"#ff7784",surplus:"#69a5ff",gold:"#f5c968"};let O,MO,TX=[],mon="",fl="支出";
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function boot(){O=await fetch("overview.json").then(r=>r.json());MO=O.monthly;const a=O.annual;surplus.textContent=money(a.surplus);income.textContent=money(a.income);expense.textContent=money(a.expense);gold.textContent=money(a.gold);rate.textContent=a.saving_rate+"%";salary.textContent=money(a.salary);ii.textContent=money(a.investment_income);avgSalary.textContent=money(a.avg_salary);avgSpend.textContent=money(a.avg_spend);refunds.textContent=money(a.refunds);bestIncome.textContent=a.best_income_month[0]+" · "+money(a.best_income_month[1]);highSpend.textContent=a.highest_spend_month[0]+" · "+money(a.highest_spend_month[1]);bestSurplus.textContent=a.best_surplus_month[0]+" · "+money(a.best_surplus_month[1]);worstSurplus.textContent=a.worst_surplus_month[0]+" · "+money(a.worst_surplus_month[1]);largest.textContent=money(a.largest_expense[1]);largestNote.textContent=a.largest_expense[0]+" · "+a.largest_expense[2];
MO.forEach(x=>{let o=document.createElement("option");o.value=x.month;o.textContent=x.month;monthSel.appendChild(o)});drawOverview();mon=MO[MO.length-2].month;await setMonth(mon)}
function drawOverview(){Plotly.newPlot("cash",[{x:MO.map(x=>x.month),y:MO.map(x=>x.income),name:"收入",type:"scatter",mode:"lines+markers",line:{color:C.income,width:3}},{x:MO.map(x=>x.month),y:MO.map(x=>x.net_expense),name:"净支出",type:"scatter",mode:"lines+markers",line:{color:C.expense,width:3}},{x:MO.map(x=>x.month),y:MO.map(x=>x.surplus),name:"结余",type:"scatter",mode:"lines+markers",line:{color:C.surplus,width:3,dash:"dot"}}],{...base,legend:{orientation:"h",y:1.13},yaxis:{...base.yaxis,tickprefix:"¥"}},cfg);
Plotly.newPlot("donut",[{labels:O.annual_categories.map(x=>x[0]),values:O.annual_categories.map(x=>x[1]),type:"pie",hole:.58,textinfo:"label+percent"}],{...base,showlegend:false,margin:{l:10,r:10,t:8,b:8}},cfg);
const cats=[...new Set(O.month_categories.map(x=>x[1]))];Plotly.newPlot("stack",cats.map(c=>({x:MO.map(x=>x.month),y:MO.map(m=>O.month_categories.find(x=>x[0]===m.month&&x[1]===c)?.[2]||0),name:c,type:"bar"})),{...base,barmode:"stack",legend:{orientation:"h",font:{size:10},y:1.18},yaxis:{...base.yaxis,tickprefix:"¥"}},cfg);
Plotly.newPlot("saving",[{x:MO.map(x=>x.month),y:MO.map(x=>x.savings_rate),name:"储蓄率",type:"scatter",mode:"lines+markers",line:{color:C.surplus,width:3},yaxis:"y"},{x:MO.map(x=>x.month),y:MO.map(x=>x.investment),name:"黄金配置",type:"bar",marker:{color:C.gold},opacity:.65,yaxis:"y2"}],{...base,legend:{orientation:"h",y:1.15},yaxis:{...base.yaxis,ticksuffix:"%"},yaxis2:{overlaying:"y",side:"right",tickprefix:"¥",gridcolor:"rgba(0,0,0,0)"}},cfg);
const remain=Math.max(0,O.annual.income-O.annual.expense-O.annual.gold),ca=O.annual_categories.slice(0,6),labs=["真实收入","生活支出","黄金投资","其余结余",...ca.map(x=>x[0])],src=[0,0,0],tar=[1,2,3],val=[O.annual.expense,O.annual.gold,remain];ca.forEach((x,i)=>{src.push(1);tar.push(4+i);val.push(x[1])});Plotly.newPlot("sankey",[{type:"sankey",node:{label:labs,pad:12,thickness:14,color:"#273654"},link:{source:src,target:tar,value:val,color:"rgba(105,165,255,.22)"}}],{...base,margin:{l:5,r:5,t:5,b:5}},cfg);["cash","stack","saving"].forEach(id=>document.getElementById(id).on("plotly_click",e=>{let m=e.points?.[0]?.x;if(/^\d{4}-\d{2}$/.test(m))setMonth(m)}))}
async function setMonth(m){mon=m;monthSel.value=m;const x=MO.find(z=>z.month===m);TX=await fetch("data/"+m+".json").then(r=>r.json());monthTitle.textContent=m+" 月度财务下钻";mi.textContent=money(x.income);me.textContent=money(x.net_expense);ms.textContent=money(x.surplus);mg.textContent=money(x.investment);mc.textContent=money(x.chacha_net);const day={};TX.forEach(z=>{day[z[0]]??={income:0,expense:0};if(z[2]==="收入")day[z[0]].income+=z[1];if(z[2]==="支出")day[z[0]].expense+=-z[1];if(z[2]==="退款")day[z[0]].expense-=z[1]});const ds=Object.keys(day).sort();Plotly.react("daily",[{x:ds,y:ds.map(d=>day[d].income),name:"收入",type:"bar",marker:{color:C.income}},{x:ds,y:ds.map(d=>day[d].expense),name:"净支出",type:"bar",marker:{color:C.expense}}],{...base,barmode:"group",legend:{orientation:"h",y:1.14},yaxis:{...base.yaxis,tickprefix:"¥"}},cfg);const cm={};TX.filter(z=>z[2]==="支出").forEach(z=>cm[z[4]]=(cm[z[4]]||0)+(-z[1]));const ll=Object.keys(cm).sort((a,b)=>cm[b]-cm[a]);Plotly.react("mdonut",[{labels:ll,values:ll.map(k=>cm[k]),type:"pie",hole:.55,textinfo:"label+percent"}],{...base,showlegend:false,margin:{l:10,r:10,t:8,b:8}},cfg);drawTable()}
function drawTable(){const q=document.getElementById("q").value.trim().toLowerCase();let a=TX.filter(x=>fl==="全部"||x[2]===fl);if(q)a=a.filter(x=>(x[3]+" "+x[6]+" "+x[4]+" "+x[5]).toLowerCase().includes(q));a.sort((x,y)=>y[0].localeCompare(x[0])||Math.abs(y[1])-Math.abs(x[1]));body.innerHTML="";a.forEach(x=>{let tr=document.createElement("tr"),cat=x[2]==="支出"?x[4]:(x[2]==="收入"?x[5]:x[2]),cl=x[2]==="投资"?"inv":(x[1]>=0?"pos":"neg");tr.innerHTML=`<td>${x[0]}</td><td><span class="badge">${x[2]}</span></td><td>${cat}</td><td>${esc(x[3])}</td><td class="${cl}">${money(x[1])}</td><td class="desc">${esc(x[6])}</td>`;body.appendChild(tr)});if(!a.length)body.innerHTML='<tr><td colspan="6" style="text-align:center;color:#8ea1c2;padding:28px">当前筛选无流水</td></tr>'}
monthSel.addEventListener("change",e=>setMonth(e.target.value));q.addEventListener("input",drawTable);document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");fl=b.dataset.f;drawTable()}));boot();
</script></main></body></html>
